name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14   # 或 macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 不再指定 Xcode 版本，直接使用默认的

      - name: Build unsigned .app
        run: |
          cd iOS
          xcodebuild build \
            -project LegacyPadDisplay.xcodeproj \
            -scheme LegacyPadDisplay \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_CODE_SIGN_FLAGS="--deep"

      - name: Package .ipa
        run: |
          APP_PATH=$(find ./iOS/build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "未找到 .app 文件，构建失败"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r LegacyPadDisplay.ipa Payload
          mv LegacyPadDisplay.ipa $RUNNER_TEMP/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegacyPadDisplay-unsigned
          path: ${{ runner.temp }}/LegacyPadDisplay.ipa
