name: Build iOS IPA (Xcode 14)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 14.3.0
        run: sudo xcode-select -s /Applications/Xcode_14.3.0.app/Contents/Developer

      - name: Build unsigned .app
        run: |
          cd iOS
          xcodebuild build \
            -project LegacyPadDisplay.xcodeproj \
            -scheme LegacyPadDisplay \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_CODE_SIGN_FLAGS="--deep"

      - name: Verify Info.plist exists
        run: |
          APP_PATH=$(find ./iOS/build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到 .app 文件"
            exit 1
          fi
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "❌ Error: Info.plist not found in $APP_PATH"
            echo "请检查 Xcode 项目配置"
            exit 1
          fi
          echo "✅ Info.plist 存在: $APP_PATH/Info.plist"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r LegacyPadDisplay.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegacyPadDisplay-unsigned
          path: LegacyPadDisplay.ipa
