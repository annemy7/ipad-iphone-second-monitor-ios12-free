# .github/workflows/build-ipa.yml
name: Build Unsigned IPA

on:
  workflow_dispatch:  # 建议手动触发，便于控制

jobs:
  build-ios:
    runs-on: macos-13   # 必须使用 macOS 13 镜像
    
    env:
      DEVELOPER_DIR: /Applications/Xcode_14.3.0.app/Contents/Developer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive  # 你项目有 submodule，这一步很关键

      # 显式选择 Xcode 版本，确保使用的是 14.3.0
      - name: Select Xcode version
        run: sudo xcode-select -s ${{ env.DEVELOPER_DIR }}

      # 进入 iOS 项目目录，构建未签名的 .app
      - name: Build unsigned .app
        run: |
          cd iOS
          xcodebuild build \
            -project LegacyPadDisplay.xcodeproj \
            -scheme LegacyPadDisplay \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_CODE_SIGN_FLAGS="--deep"

      # 手动将 .app 打包成 .ipa 文件
      - name: Package .ipa
        run: |
          # 找到 Xcode 编译生成的 .app 文件路径
          APP_PATH=$(find ./iOS/build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "未找到 .app 文件，构建失败"
            exit 1
          fi
          
          # 创建 Payload 文件夹并放入 .app
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          # 压缩成 .ipa
          zip -r LegacyPadDisplay.ipa Payload
          
          # 将 .ipa 移到方便上传的位置
          mv LegacyPadDisplay.ipa $RUNNER_TEMP/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegacyPadDisplay-unsigned
          path: ${{ runner.temp }}/LegacyPadDisplay.ipa
