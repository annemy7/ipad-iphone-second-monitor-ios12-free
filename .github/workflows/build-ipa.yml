name: Build iOS 12 unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select \
            --switch /Applications/Xcode_15.4.app/Contents/Developer

          sw_vers
          uname -m
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project iOS/LegacyPadDisplay.xcodeproj \
            -scheme LegacyPadDisplay \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            clean build

      - name: Locate built app
        id: app
        shell: bash
        run: |
          APP_PATH="$(
            find "$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos" \
              -maxdepth 1 \
              -type d \
              -name '*.app' \
              -print \
              -quit
          )"

          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle was produced"
            find "$GITHUB_WORKSPACE/build/Build/Products" -maxdepth 3 -print
            exit 1
          fi

          echo "Found app: $APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package unsigned IPA
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"

          APP_PATH="${{ steps.app.outputs.path }}"
          APP_NAME="$(basename "$APP_PATH")"

          ditto \
            "$APP_PATH" \
            "$GITHUB_WORKSPACE/ipa/Payload/$APP_NAME"

          cd "$GITHUB_WORKSPACE/ipa"
          zip -qry \
            "$GITHUB_WORKSPACE/LegacyPadDisplay-iOS12-unsigned.ipa" \
            Payload

          unzip -l \
            "$GITHUB_WORKSPACE/LegacyPadDisplay-iOS12-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LegacyPadDisplay-iOS12-unsigned
          path: LegacyPadDisplay-iOS12-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
